name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android launcher icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/make_icons.py

      - name: Apply Android full-screen overrides
        run: |
          cp android-overrides/java/MainActivity.java android/app/src/main/java/jp/noclip/backrooms/MainActivity.java
          cp android-overrides/res/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCLIP-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
